# Lint configuration (ruff).
#
# ruff IS installed here (0.17.6). This file previously claimed it was not, and
# carried a `target-version` key under [format], which ruff rejects outright: it
# is a command-line flag, not a configuration field, so every `ruff check` in
# this repo died parsing this file before looking at a single source file. That
# is how lint went unexecuted without anyone noticing.
#
# Run it as:
#   python -m ruff check --target-version py314 src/ tests/ tools/ conformance/
#
# Line length: E501 is deliberately NOT enabled. The 1626 E501 findings under
# the default 88-column limit are all pre-existing formatting choices, not
# defects, and reformatting them would rewrite most of src/ for no behavioural
# gain. If a limit is ever adopted it should come with a formatting pass of its
# own, not be smuggled in through a lint config.

[lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[lint.per-file-ignores]
# E701/E702 (statement after colon / after semicolon) are style only, and the
# 56 remaining findings all sit in three integration tests where a compact
# `if mode == "x": value = y` ladder or `a.append(x); b.append(y)` pair is
# easier to read than a four-line expansion. ruff has no autofix for them, so
# clearing these means 56 hand edits in the files that gate TEST-028 -- the
# exact change where a mis-edit hides in plain sight. The rules stay on
# everywhere else.
"tests/m3/test_integration_live.py" = ["E701", "E702"]
"tests/m3/test_integration_live_concurrency.py" = ["E701", "E702"]
"tests/m3/test_integration_live_replay.py" = ["E701", "E702"]

[format]
quote-style = "double"

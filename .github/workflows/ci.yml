name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # The conformance suite enforces platform requirements rather than skipping
    # them: seven fixtures raise EnforcementUnavailable unless they run on
    # Windows with a durable local database (TEST-004/025/028) or the fixed
    # document provider is available (TEST-008/014/020/023). On ubuntu-latest
    # those seven fail by design, so the suite cannot go green there. Running on
    # Windows is the honest choice: it tests what the code actually supports.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Preparation checks
        run: |
          python tools/devprep.py check
      - name: Preparation tests
        run: |
          python -m unittest discover -s tests/preparation -v
      - name: Conformance runner (clean db)
        # bash for the POSIX env-assignment prefix and the line continuations
        # below; pwsh would read "PYTHONPATH=src python ..." as one command name.
        shell: bash
        run: |
          PYTHONPATH=src python -m conformance.runner \
            --db .tmp/ci-conformance.sqlite \
            --json .tmp/ci-conformance.json \
            --frozen-evidence .tmp/ci-conformance-frozen.json
      # Without this, a failing conformance run reports only the pass/fail
      # totals: the per-test detail stays inside the JSON the runner wrote and
      # dies with the job. `if: always()` is the point - the artifact matters
      # most on the runs that fail.
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: |
            .tmp/ci-conformance.json
            .tmp/ci-conformance-frozen.json
          if-no-files-found: warn
  note:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "This workflow is a config skeleton; it has NOT been run against a real remote + CI host yet. Do not claim CI has passed until it is actually triggered here."